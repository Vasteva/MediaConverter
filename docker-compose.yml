services:
  vastiva:
    image: ghcr.io/vasteva/mediaconverter:latest
    container_name: vastiva
    environment:
      # Unprivileged: the entrypoint drops root before vastiva binds this,
      # and only root/CAP_NET_BIND_SERVICE can bind <1024 (#37). The
      # externally-visible port is set below, in "ports:".
      - PORT=8080
      - SOURCE_DIR=/storage
      - DEST_DIR=/output
      - GPU_VENDOR=${GPU_VENDOR:-cpu}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_ENDPOINT=${AI_ENDPOINT:-}
      - AI_MODEL=${AI_MODEL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LICENSE_KEY=${LICENSE_KEY:-}
      - SCANNER_ENABLED=${SCANNER_ENABLED:-false}
      - SCANNER_MODE=${SCANNER_MODE:-manual}
      - SCANNER_PROCESSED_FILE=/data/processed.json
      - REPLACE_IN_PLACE=${REPLACE_IN_PLACE:-false}
      - HOLDING_DIR=${HOLDING_DIR:-/storage/.vastiva-replaced}
      - PUID=${PUID:--1}
      - PGID=${PGID:--1}
      # Without this, CORS_ORIGINS never reaches the container and every
      # deployment silently falls back to the localhost dev defaults.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ${MEDIA_ROOT:-/mnt/media}:/storage
      - ${MEDIA_ROOT:-/mnt/media}/output:/output
      - vastiva-data:/data
    devices:
      - /dev/dri:/dev/dri
      # Uncomment to enable disc extraction (MakeMKV). Adjust device path if your
      # optical drive appears as /dev/sr1, /dev/cdrom, etc.
      # - /dev/sr0:/dev/sr0
    ports:
      - "8091:8080"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 12G
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vastiva.rule=Host(`vasteva.wtzhome.com`)"
      - "traefik.http.routers.vastiva.entrypoints=websecure"
      - "traefik.http.routers.vastiva.tls.certresolver=letsencrypt"
      - "traefik.http.services.vastiva.loadbalancer.server.port=8080"

volumes:
  vastiva-data:
    driver: local

networks:
  traefik:
    external: true
