services:
  vastiva:
    image: ghcr.io/vasteva/mediaconverter:latest
    container_name: vastiva
    environment:
      - PORT=80
      - SOURCE_DIR=/storage
      - DEST_DIR=/output
      - GPU_VENDOR=${GPU_VENDOR:-cpu}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_ENDPOINT=${AI_ENDPOINT:-}
      - AI_MODEL=${AI_MODEL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LICENSE_KEY=${LICENSE_KEY:-}
      - SCANNER_ENABLED=${SCANNER_ENABLED:-false}
      - SCANNER_MODE=${SCANNER_MODE:-manual}
      - SCANNER_PROCESSED_FILE=/data/processed.json
    volumes:
      - ${MEDIA_ROOT:-/mnt/media}:/storage
      - ${MEDIA_ROOT:-/mnt/media}/output:/output
      - vastiva-data:/data
    devices:
      - /dev/dri:/dev/dri
      # Uncomment to enable disc extraction (MakeMKV). Adjust device path if your
      # optical drive appears as /dev/sr1, /dev/cdrom, etc.
      # - /dev/sr0:/dev/sr0
    ports:
      - "8091:80"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vastiva.rule=Host(`vasteva.wtzhome.com`)"
      - "traefik.http.routers.vastiva.entrypoints=websecure"
      - "traefik.http.routers.vastiva.tls.certresolver=letsencrypt"
      - "traefik.http.services.vastiva.loadbalancer.server.port=80"

volumes:
  vastiva-data:
    driver: local

networks:
  traefik:
    external: true
