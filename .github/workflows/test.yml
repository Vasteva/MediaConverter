name: Go Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Build Frontend
      run: |
        cd web
        npm ci
        npm run build

    - name: Build Go
      run: go build -v ./...

    - name: Vet Go
      run: go vet ./...

    # -race is the point of this step. The job manager is a goroutine worker
    # pool whose jobs are serialised concurrently from three places; those races
    # pass silently without the detector, which is how they reached production.
    - name: Test Go
      run: go test -race -v ./...
